<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>json-to-dom v4</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-card">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="logo-badge">KS</span>
        <div class="title-group">
          <h1>json-to-dom</h1>
          <span class="version-tag">v4.0</span>
        </div>
      </div>
      <span class="status-indicator" id="statusBadge">Ready</span>
    </header>

    <!-- Main Content -->
    <main class="popup-body">
      <!-- 1. Searchable Target DOM ID (Input with Datalist) -->
      <div class="form-group">
        <div class="label-row">
          <label for="domIdInput" class="form-label">Target DOM ID</label>
          <span id="idCountBadge" class="count-badge">Scanning...</span>
        </div>
        <div class="input-row">
          <input 
            type="text" 
            id="domIdInput" 
            list="domIdDatalist" 
            class="form-input" 
            placeholder="Type or pick DOM ID..." 
            autocomplete="off"
            disabled
          />
          <datalist id="domIdDatalist">
            <!-- Dynamically populated & sorted alphabetically -->
          </datalist>
          <button id="btnRefreshIds" class="btn-icon-refresh" type="button" title="Rescan page IDs">
            ↻
          </button>
        </div>
      </div>

      <!-- 2. JSON File Selector (.json only) -->
      <div class="form-group">
        <div class="label-row">
          <label for="jsonFileInput" class="form-label">Select JSON File</label>
          <span id="fileStatusBadge" class="count-badge">No file</span>
        </div>
        <input 
          type="file" 
          id="jsonFileInput" 
          class="form-file-input" 
          accept=".json,application/json" 
        />
      </div>

      <!-- 3. Render Button (Clean & Ready for your code) -->
      <button id="btnRender" class="btn btn-render" type="button">
        <span class="btn-symbol">⚡</span> Render
      </button>

      <!-- Feedback / Status Area -->
      <div id="statusMessage" class="status-message">
        Choose DOM ID and JSON file, then click Render.
      </div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Powered by <strong>@keshavsoft/json-to-dom</strong></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
