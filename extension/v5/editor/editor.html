<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>json-to-dom Monaco Spec Workbench</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e1e1e;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Toolbar */
    .top-bar {
      height: 42px;
      background-color: #252526;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #333333;
      user-select: none;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: #0d9488;
      color: #ffffff;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .schema-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .target-badge {
      font-size: 11px;
      color: #9cdcfe;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .action-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-apply {
      background: #0d9488;
      color: #ffffff;
    }

    .btn-apply:hover {
      background: #0f766e;
    }

    .btn-format {
      background: #333333;
      color: #ffffff;
    }

    .btn-format:hover {
      background: #444444;
    }

    /* Monaco Container */
    #monacoContainer {
      flex: 1;
      width: 100%;
      height: calc(100vh - 42px);
    }
  </style>
</head>

<body>
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-section">
      <span class="logo-badge">KS Monaco</span>
      <span id="schemaNameLabel" class="schema-title">Schema: table.simple.base</span>
      <span id="targetIdBadge" class="target-badge">Target: None</span>
    </div>

    <div class="action-section">
      <button id="btnFormatJson" class="btn btn-format" type="button" title="Format JSON">
        Format
      </button>
      <button id="btnApplyToPage" class="btn btn-apply" type="button" title="Render this spec directly into the target DOM ID on active tab">
        ⚡ Render to DOM
      </button>
    </div>
  </header>

  <!-- Monaco Editor Container -->
  <div id="monacoContainer"></div>

  <!-- Monaco Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script src="editor.js"></script>
</body>

</html>
