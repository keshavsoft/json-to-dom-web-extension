<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>json-to-dom Spec Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 48px;
      min-height: 48px;
      background-color: #252526;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #333333;
      user-select: none;
      gap: 12px;
      z-index: 10;
    }

    .brand-badge {
      background: #0d9488;
      color: #ffffff;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .schema-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .schema-select {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 4px;
      font-weight: 600;
      min-width: 320px;
      max-width: 480px;
      outline: none;
      cursor: pointer;
    }

    .schema-select:focus {
      border-color: #0d9488;
    }

    .btn-show {
      background: #0d9488;
      color: #ffffff;
      border: none;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-show:hover {
      background: #0f766e;
    }

    .btn-show:active {
      transform: translateY(1px);
    }

    .status-text {
      font-size: 12px;
      color: #10b981;
      margin-left: auto;
      font-weight: 500;
    }

    /* Code Editor Workspace */
    .editor-workspace {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px);
      display: flex;
      position: relative;
      background-color: #1e1e1e;
      overflow: hidden;
    }

    /* Monaco Container (if loaded) */
    #monacoContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: none;
    }

    /* Built-in Syntax Highlighted Code Viewer & Editor */
    .built-in-editor {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: auto;
      background: #1e1e1e;
      font-family: Consolas, "Courier New", "JetBrains Mono", monospace;
      font-size: 13px;
      line-height: 20px;
    }

    /* Line Numbers Gutter */
    .gutter {
      background-color: #1e1e1e;
      color: #858585;
      padding: 16px 14px 16px 16px;
      text-align: right;
      user-select: none;
      border-right: 1px solid #2d2d2d;
      min-width: 55px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 20px;
    }

    /* Code Container */
    .code-container {
      flex: 1;
      padding: 16px 20px;
      overflow-x: auto;
      white-space: pre;
      color: #d4d4d4;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 20px;
      outline: none;
    }

    /* JSON Syntax Highlighting Classes (VS Code Dark Theme) */
    .json-key {
      color: #9cdcfe;
    }

    .json-string {
      color: #ce9178;
    }

    .json-number {
      color: #b5cea8;
    }

    .json-boolean {
      color: #569cd6;
      font-weight: 600;
    }

    .json-null {
      color: #569cd6;
      font-weight: 600;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 6px;
      border: 3px solid #1e1e1e;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4f4f4f;
    }
  </style>
</head>

<body>
  <!-- Clean Top Bar -->
  <header class="top-bar">
    <span class="brand-badge">KS Monaco</span>
    <label class="schema-label" for="specSelect">Select JSON Spec:</label>
    <select id="specSelect" class="schema-select">
      <option value="" disabled selected>Loading schemas...</option>
    </select>
    <button id="btnShowJson" class="btn-show" type="button" title="Display selected JSON in editor">
      Show JSON
    </button>
    <span id="statusIndicator" class="status-text">Loading catalog...</span>
  </header>

  <!-- Editor Workspace -->
  <main class="editor-workspace">
    <!-- Monaco container (used if CDN allows) -->
    <div id="monacoContainer"></div>

    <!-- Built-in high-performance syntax-highlighted editor (guaranteed to render 100% of the time) -->
    <div class="built-in-editor" id="builtInEditor">
      <div class="gutter" id="lineGutter">1</div>
      <div class="code-container" id="codeContent" contenteditable="true" spellcheck="false">// Loading spec JSON...</div>
    </div>
  </main>

  <script src="editor.js"></script>
</body>

</html>
